name: Publish images and deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldmerge-production
  cancel-in-progress: false

jobs:
  images:
    name: Publish immutable images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}
      backend_image: ${{ steps.immutable.outputs.backend_image }}
      frontend_image: ${{ steps.immutable.outputs.frontend_image }}
    steps:
      - name: Resolve the tested release
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="${WORKFLOW_RUN_SHA:-${GITHUB_SHA}}"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The resolved commit is not a full Git SHA." >&2
            exit 1
          fi
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/${repository}-backend:${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${repository}-frontend:${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.deploy_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.backend_image }}
          labels: |
            org.opencontainers.image.title=FieldMerge Backend
            org.opencontainers.image.description=FastAPI synchronization service and database migrations
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.deploy_sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=fieldmerge-backend
          cache-to: type=gha,mode=max,scope=fieldmerge-backend
          provenance: mode=max
          sbom: true

      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.frontend_image }}
          labels: |
            org.opencontainers.image.title=FieldMerge Live Demo
            org.opencontainers.image.description=React and Nginx public entry point
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.deploy_sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=fieldmerge-frontend
          cache-to: type=gha,mode=max,scope=fieldmerge-frontend
          provenance: mode=max
          sbom: true

      - name: Record immutable image digests
        id: immutable
        env:
          BACKEND_TAG: ${{ steps.release.outputs.backend_image }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_TAG: ${{ steps.release.outputs.frontend_image }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST"
          test -n "$FRONTEND_DIGEST"
          echo "backend_image=${BACKEND_TAG%:*}@${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_TAG%:*}@${FRONTEND_DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### FieldMerge container images"
            echo ""
            echo "Published the backend and frontend images for commit \`${{ steps.release.outputs.deploy_sha }}\`."
            echo ""
            echo "Azure deployment enabled: \`${{ vars.AZURE_DEPLOYMENT_ENABLED || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Migrate, deploy, and verify
    needs: images
    if: vars.AZURE_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'fieldmerge' }}
      ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME || 'prod' }}
      CONTAINER_APPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT || 'cae-fieldmerge-prod' }}
      CUSTOM_DOMAIN: ${{ vars.FIELDMERGE_CUSTOM_DOMAIN || 'fieldmerge.irfanburakozer.com' }}
      REQUIRE_CUSTOM_DOMAIN: ${{ vars.FIELDMERGE_REQUIRE_CUSTOM_DOMAIN || 'false' }}
      DATABASE_URL: ${{ secrets.FIELDMERGE_DATABASE_URL }}
      BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.images.outputs.deploy_sha }}

      - name: Validate deployment configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP CONTAINER_APPS_ENVIRONMENT DATABASE_URL AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production setting $name is missing." >&2
              exit 1
            fi
          done
          if [[ "$DATABASE_URL" != *"ssl=require"* ]]; then
            echo "FIELDMERGE_DATABASE_URL must enforce ssl=require." >&2
            exit 1
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate infrastructure templates
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/azure/foundation.bicep --stdout > /dev/null
          az bicep build --file infra/azure/migration.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null

      - name: Preserve the existing custom domain and certificate
        id: custom_domain
        shell: bash
        run: |
          set -euo pipefail
          web_app="${NAME_PREFIX}-web-${ENVIRONMENT_NAME}"
          existing_web_app="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$web_app" \
            --query name \
            --output tsv \
            --only-show-errors 2>/dev/null || true)"

          if [[ -z "$existing_web_app" ]]; then
            echo "First deployment: using the generated Azure hostname until DNS and the managed certificate are configured."
            echo "domain_name=" >> "$GITHUB_OUTPUT"
            echo "certificate_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          certificate_id="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$web_app" \
            --query "properties.configuration.ingress.customDomains[?name=='${CUSTOM_DOMAIN}'].certificateId | [0]" \
            --output tsv \
            --only-show-errors 2>/dev/null || true)"
          if [[ -z "$certificate_id" ]]; then
            certificate_id="$(az containerapp env certificate list \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APPS_ENVIRONMENT" \
              --managed-certificates-only \
              --query "[?properties.subjectName=='${CUSTOM_DOMAIN}'].id | [0]" \
              --output tsv \
              --only-show-errors 2>/dev/null || true)"
          fi

          if [[ -z "$certificate_id" ]]; then
            if [[ "$REQUIRE_CUSTOM_DOMAIN" == "true" ]]; then
              echo "The required ${CUSTOM_DOMAIN} managed certificate could not be found." >&2
              echo "Stopping before deployment so the hostname binding cannot be removed." >&2
              exit 1
            fi
            echo "No managed certificate is bound yet; retaining the generated Azure hostname."
            echo "domain_name=" >> "$GITHUB_OUTPUT"
            echo "certificate_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "domain_name=$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "certificate_id=$certificate_id" >> "$GITHUB_OUTPUT"

      - name: Create or update the migration job
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "migration-${GITHUB_RUN_ID}" \
            --template-file infra/azure/migration.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              backendImage="$BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
            --query properties.outputs.migrationJobName.value \
            --output tsv \
            --only-show-errors)"
          test -n "$job_name"
          echo "job_name=$job_name" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations and wait for success
        env:
          MIGRATION_JOB: ${{ steps.migration.outputs.job_name }}
        shell: bash
        run: |
          set -euo pipefail
          execution_name="$(az containerapp job start \
            --resource-group "$RESOURCE_GROUP" \
            --name "$MIGRATION_JOB" \
            --query name \
            --output tsv \
            --only-show-errors)"
          test -n "$execution_name"
          for _ in {1..60}; do
            status="$(az containerapp job execution show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$MIGRATION_JOB" \
              --job-execution-name "$execution_name" \
              --query properties.status \
              --output tsv \
              --only-show-errors)"
            case "$status" in
              Succeeded) echo "Database migration succeeded."; exit 0 ;;
              Failed|Canceled) echo "Migration ended with $status." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration did not finish within ten minutes." >&2
          exit 1

      - name: Record the currently deployed images
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous_frontend="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "${NAME_PREFIX}-web-${ENVIRONMENT_NAME}" \
            --query 'properties.template.containers[0].image' --output tsv \
            --only-show-errors 2>/dev/null || true)"
          previous_backend="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "${NAME_PREFIX}-api-${ENVIRONMENT_NAME}" \
            --query 'properties.template.containers[0].image' --output tsv \
            --only-show-errors 2>/dev/null || true)"
          echo "frontend_image=$previous_frontend" >> "$GITHUB_OUTPUT"
          echo "backend_image=$previous_backend" >> "$GITHUB_OUTPUT"

      - name: Deploy the application revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${GITHUB_RUN_ID}" \
            --template-file infra/azure/apps.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              frontendImage="$FRONTEND_IMAGE" \
              backendImage="$BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
              browserCustomDomainName="$CUSTOM_DOMAIN" \
              webCustomDomainName="${{ steps.custom_domain.outputs.domain_name }}" \
              webCustomDomainCertificateId="${{ steps.custom_domain.outputs.certificate_id }}" \
              webMinReplicas=1 webMaxReplicas=1 \
              apiMinReplicas=1 apiMaxReplicas=1 \
            --query properties.outputs \
            --output json \
            --only-show-errors)"
          web_url="$(jq -r '.webAppUrl.value' <<< "$outputs")"
          test -n "$web_url" && test "$web_url" != null
          public_url="$web_url"
          if [[ -n "${{ steps.custom_domain.outputs.domain_name }}" ]]; then
            public_url="https://${{ steps.custom_domain.outputs.domain_name }}"
          fi
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"
          {
            echo "### FieldMerge production deployment"
            echo ""
            echo "Deployed commit: \`${{ needs.images.outputs.deploy_sha }}\`"
            echo ""
            echo "Public URL: [$public_url]($public_url)"
            echo ""
            echo "Azure origin: [$web_url]($web_url)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live HTTP, database, and WebSocket path
        id: smoke
        continue-on-error: true
        env:
          FIELDMERGE_SMOKE_URL: ${{ steps.release.outputs.public_url }}
        shell: bash
        run: |
          set -euo pipefail
          for path in /healthz /health/ready; do
            ready=false
            for _ in {1..36}; do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 "${FIELDMERGE_SMOKE_URL}${path}" > /dev/null; then
                ready=true
                break
              fi
              sleep 5
            done
            if [[ "$ready" != true ]]; then
              echo "Smoke check failed for ${FIELDMERGE_SMOKE_URL}${path}." >&2
              exit 1
            fi
          done
          python -m pip install "httpx>=0.28,<1" "websockets>=15,<16"
          python scripts/smoke.py

      - name: Restore previous images after a failed release check
        if: >-
          steps.smoke.outcome == 'failure' &&
          steps.previous.outputs.frontend_image != '' &&
          steps.previous.outputs.backend_image != ''
        env:
          PREVIOUS_FRONTEND_IMAGE: ${{ steps.previous.outputs.frontend_image }}
          PREVIOUS_BACKEND_IMAGE: ${{ steps.previous.outputs.backend_image }}
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "rollback-${GITHUB_RUN_ID}" \
            --template-file infra/azure/apps.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              frontendImage="$PREVIOUS_FRONTEND_IMAGE" \
              backendImage="$PREVIOUS_BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
              browserCustomDomainName="$CUSTOM_DOMAIN" \
              webCustomDomainName="${{ steps.custom_domain.outputs.domain_name }}" \
              webCustomDomainCertificateId="${{ steps.custom_domain.outputs.certificate_id }}" \
              webMinReplicas=1 webMaxReplicas=1 \
              apiMinReplicas=1 apiMaxReplicas=1 \
            --only-show-errors \
            --output none

      - name: Fail after an unsuccessful release check
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "The release check failed. Previous images were restored when available." >&2
          exit 1

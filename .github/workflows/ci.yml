name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldmerge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fieldmerge
          POSTGRES_USER: fieldmerge
          POSTGRES_PASSWORD: fieldmerge-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fieldmerge -d fieldmerge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      FIELDMERGE_ENVIRONMENT: test
      FIELDMERGE_DATABASE_URL: postgresql+asyncpg://fieldmerge:fieldmerge-ci@localhost:5432/fieldmerge
      FIELDMERGE_AUTO_CREATE_SCHEMA: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes --requirement requirements-dev.lock
          python -m pip install --no-deps --editable .

      - name: Check formatting
        run: ruff format --check . ../scripts/smoke.py

      - name: Lint
        run: ruff check . ../scripts/smoke.py

      - name: Type-check
        run: mypy src

      - name: Verify migrations on PostgreSQL
        run: alembic upgrade head && alembic check

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build production frontend
        run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start the complete PostgreSQL-backed stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify frontend ingress
        run: curl --fail --show-error --silent http://localhost:3002/healthz

      - name: Verify persisted synchronization path
        shell: pwsh
        run: ./scripts/smoke.ps1

      - name: Show service state and clean up
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 120
          docker compose down --volumes

  deployment-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Azure infrastructure templates
        shell: bash
        run: |
          set -euo pipefail
          az bicep build --file infra/azure/foundation.bicep --stdout > /dev/null
          az bicep build --file infra/azure/migration.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null

      - name: Parse Azure PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/azure -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }

      - name: Compile the live smoke test
        run: python -m py_compile scripts/smoke.py

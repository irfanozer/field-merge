name: fieldmerge-prod

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend-runtime
  image: ${BACKEND_IMAGE:?An immutable backend image digest is required}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Steady-state service caps total 608 MiB on the 1 GiB economy host.
  mem_limit: 256m
  memswap_limit: 512m
  cpus: 0.75
  pids_limit: 128
  environment:
    FIELDMERGE_ENVIRONMENT: production
    FIELDMERGE_DATABASE_URL: postgresql+asyncpg://fieldmerge:${POSTGRES_PASSWORD:?Database password is required}@postgres:5432/fieldmerge
    FIELDMERGE_CORS_ORIGINS: ${FIELDMERGE_CORS_ORIGINS:-[]}
    FIELDMERGE_AUTO_CREATE_SCHEMA: "false"
    FIELDMERGE_SQL_ECHO: "false"
    FIELDMERGE_PUBLIC_DEMO_MODE: "true"
    FIELDMERGE_MAX_PENDING_OPERATIONS: "20"
    FIELDMERGE_MAX_LOG_OPERATIONS: "1000"
    FIELDMERGE_DATABASE_POOL_SIZE: "3"
    FIELDMERGE_DATABASE_MAX_OVERFLOW: "1"
  networks: [application]
  logging: *bounded-logging

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 512m
    cpus: 0.50
    pids_limit: 128
    environment:
      POSTGRES_DB: fieldmerge
      POSTGRES_USER: fieldmerge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=20, -c, work_mem=2MB, -c, maintenance_work_mem=32MB]
    volumes:
      - type: bind
        source: /srv/fieldmerge/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    # Database and application ports are reachable only on this Docker network.
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks: [application]
    logging: *bounded-logging

  backend:
    <<: *backend-runtime
    restart: unless-stopped
    # The committed-state event bus lives in this process. Scaling workers or
    # replicas requires a shared event transport before it can be correct.
    deploy:
      replicas: 1
    stop_grace_period: 30s
    command:
      - uvicorn
      - fieldmerge.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --limit-concurrency
      - "64"
      - --ws
      - websockets
      - --ws-max-size
      - "32768"
      - --ws-max-queue
      - "16"
      - --ws-ping-interval
      - "20"
      - --ws-ping-timeout
      - "20"
      - --timeout-graceful-shutdown
      - "20"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  migrate:
    <<: *backend-runtime
    profiles: [maintenance]
    restart: "no"
    command: [alembic, upgrade, head]

  api-proxy:
    # Keep the same audited Nginx image used by frontend/Dockerfile.
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    restart: unless-stopped
    read_only: true
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    memswap_limit: 64m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - type: bind
        source: ./api-proxy.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [application, origin-proxy]
    logging: *bounded-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 128
    environment:
      ORIGIN_DOMAIN: ${ORIGIN_DOMAIN:?Origin domain is required}
      ORIGIN_VERIFY_TOKEN: ${ORIGIN_VERIFY_TOKEN:?Origin token is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/fieldmerge/caddy/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /srv/fieldmerge/caddy/config
        target: /config
        bind:
          create_host_path: false
    depends_on:
      api-proxy:
        condition: service_healthy
    # This process check needs neither public DNS nor a newly issued certificate.
    # Do not publish the loopback-only Caddy admin port.
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [origin-proxy, internet]
    logging: *bounded-logging

networks:
  application:
    internal: true
  origin-proxy:
    internal: true
  internet: {}

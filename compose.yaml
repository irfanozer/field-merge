name: fieldmerge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldmerge}
      POSTGRES_USER: ${POSTGRES_USER:-fieldmerge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldmerge-local-only}
    ports:
      - "127.0.0.1:${FIELDMERGE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - fieldmerge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - fieldmerge

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      FIELDMERGE_ENVIRONMENT: local-compose
      FIELDMERGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fieldmerge}:${POSTGRES_PASSWORD:-fieldmerge-local-only}@postgres:5432/${POSTGRES_DB:-fieldmerge}
      FIELDMERGE_CORS_ORIGINS: '${FIELDMERGE_CORS_ORIGINS:-["http://localhost:3002","http://127.0.0.1:3002"]}'
      FIELDMERGE_AUTO_CREATE_SCHEMA: "false"
      FIELDMERGE_SQL_ECHO: "false"
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn fieldmerge.main:app --host 0.0.0.0 --port 8000 --proxy-headers
    ports:
      - "127.0.0.1:${FIELDMERGE_BACKEND_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fieldmerge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:${FIELDMERGE_FRONTEND_PORT:-3002}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - fieldmerge

volumes:
  fieldmerge-postgres-data:
    name: fieldmerge-postgres-data

networks:
  fieldmerge:
    name: fieldmerge-network
